<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button Portal — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="page">
    <main class="container">
      <header class="topbar">
        <div class="brand brand--compact">
          <div class="brand-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1.5"/>
              <rect x="14" y="3" width="7" height="7" rx="1.5"/>
              <rect x="3" y="14" width="7" height="7" rx="1.5"/>
              <rect x="14" y="14" width="7" height="7" rx="1.5"/>
            </svg>
          </div>
          <div class="brand-text">
            <h1>Button Portal</h1>
            <p>Welkom, <span id="visitor-name" class="welcome-name">...</span></p>
          </div>
        </div>
        <div class="topbar-actions">
          <a id="admin-link" href="/admin" class="btn-secondary hidden">Admin</a>
          <button type="button" id="logout-btn" class="btn-secondary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Uitloggen
          </button>
        </div>
      </header>

      <section class="card" id="content">
        <div id="loading" class="loading">
          <div class="spinner"></div>
          <span>Knoppen laden...</span>
        </div>

        <div id="dashboard-content" class="hidden">
          <div class="section-header">
            <h2>Jouw knoppen</h2>
            <span id="button-count" class="badge">0 knoppen</span>
          </div>

          <div class="search-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" id="search" class="search-input" placeholder="Zoek knoppen..." autocomplete="off">
          </div>

          <div id="buttons-grid" class="buttons-grid"></div>
          <p id="no-results" class="no-results hidden">Geen knoppen gevonden voor je zoekopdracht.</p>

          <div id="empty-message" class="empty-state hidden">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7" rx="1"/>
                <rect x="14" y="3" width="7" height="7" rx="1"/>
                <rect x="3" y="14" width="7" height="7" rx="1"/>
                <rect x="14" y="14" width="7" height="7" rx="1"/>
              </svg>
            </div>
            <h3>Geen knoppen</h3>
            <p>Je hebt nog geen knoppen. Vraag de beheerder om knoppen toe te voegen.</p>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="/js/ui.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
