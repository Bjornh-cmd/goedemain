<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button Portal — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="page">
    <main class="container">
      <header class="topbar">
        <div class="brand brand--compact">
          <div class="brand-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9"/>
              <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
            </svg>
          </div>
          <div class="brand-text">
            <h1>Admin</h1>
            <p>Beheer bezoekers en knoppen in de database</p>
          </div>
        </div>
        <div class="topbar-actions">
          <a href="/dashboard" class="btn-secondary">Dashboard</a>
          <button type="button" id="logout-btn" class="btn-secondary">Uitloggen</button>
        </div>
      </header>

      <div id="admin-denied" class="card hidden">
        <div class="empty-state">
          <h3>Geen toegang</h3>
          <p>Alleen de admin-bezoeker kan deze pagina gebruiken.</p>
          <a href="/dashboard" class="btn-secondary" style="margin-top:1rem;display:inline-flex;">Terug naar dashboard</a>
        </div>
      </div>

      <div id="admin-content" class="hidden">
        <section class="card admin-section">
          <div class="section-header">
            <h2>Bezoekers</h2>
            <button type="button" id="add-visitor-btn" class="btn-secondary">+ Bezoeker</button>
          </div>
          <div id="visitors-list" class="admin-list"></div>
        </section>

        <section id="visitor-detail" class="card admin-section hidden">
          <div class="section-header">
            <h2 id="detail-title">Knoppen</h2>
            <button type="button" id="add-button-btn" class="btn-secondary">+ Knop</button>
          </div>
          <p id="detail-meta" class="subtitle"></p>
          <div id="buttons-list" class="admin-list"></div>
        </section>
      </div>

      <div id="loading" class="loading">
        <div class="spinner"></div>
        <span>Laden...</span>
      </div>
    </main>
  </div>

  <dialog id="visitor-dialog" class="admin-dialog">
    <form id="visitor-form" method="dialog" class="admin-dialog-inner">
      <h3 id="visitor-dialog-title">Bezoeker toevoegen</h3>
      <label for="visitor-name">Naam</label>
      <div class="input-wrap">
        <input type="text" id="visitor-name" class="vlog-code-input" required>
      </div>
      <label for="visitor-id">Id (optioneel)</label>
      <div class="input-wrap">
        <input type="text" id="visitor-id" class="vlog-code-input" placeholder="auto van naam">
      </div>
      <label for="visitor-password">Wachtwoord</label>
      <div class="input-wrap">
        <input type="password" id="visitor-password" class="vlog-code-input">
      </div>
      <p id="visitor-form-error" class="error hidden"><span id="visitor-form-error-text"></span></p>
      <div class="admin-dialog-actions">
        <button type="button" id="visitor-cancel" class="btn-secondary">Annuleren</button>
        <button type="submit" class="btn-primary">Opslaan</button>
      </div>
    </form>
  </dialog>

  <dialog id="button-dialog" class="admin-dialog">
    <form id="button-form" method="dialog" class="admin-dialog-inner">
      <h3 id="button-dialog-title">Knop toevoegen</h3>
      <label for="button-label">Label</label>
      <div class="input-wrap">
        <input type="text" id="button-label" class="vlog-code-input" required>
      </div>
      <label for="button-url">URL</label>
      <div class="input-wrap">
        <input type="url" id="button-url" class="vlog-code-input" placeholder="https://..." required>
      </div>
      <p id="button-form-error" class="error hidden"><span id="button-form-error-text"></span></p>
      <div class="admin-dialog-actions">
        <button type="button" id="button-cancel" class="btn-secondary">Annuleren</button>
        <button type="submit" class="btn-primary">Opslaan</button>
      </div>
    </form>
  </dialog>

  <script src="/js/dev-reload.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
