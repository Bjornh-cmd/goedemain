# Coolify / productie: geen host-poort (proxy gebruikt expose). Lokaal: zie docker-compose.local.yml
services:
  button-portal:
    build: .
    expose:
      - "3000"
    environment:
      SESSION_SECRET: ${SESSION_SECRET:-verander-dit-geheim-in-productie}
      PORT: 3000
      HOST: 0.0.0.0
      NODE_ENV: production
      ADMIN_VISITOR_ID: bjorn
      NODE_OPTIONS: --max-old-space-size=350
      VERCEL_TOKEN: ${VERCEL_TOKEN:-}
      VERCEL_TEAM_ID: ${VERCEL_TEAM_ID:-}
    mem_limit: 400m
    memswap_limit: 400m
    volumes:
      - ./data:/app/data
      - ./vid:/app/vid
    restart: unless-stopped
